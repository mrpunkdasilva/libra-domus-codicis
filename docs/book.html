<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Livro - Libraria Domus Codicis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div class="container">
    <header>
      <a href="index.html" style="text-decoration: none;">
        <h1>LIBRARIA DOMUS CODICIS</h1>
      </a>
    </header>

    <div class="back-button">
      <a href="index.html" class="back-link">&lt;&lt; VOLTAR</a>
    </div>

    <div class="book-details" id="book-details">
      <div class="skeleton-details">
        <div class="skeleton-cover-large skeleton"></div>
        <div class="skeleton-info">
          <div class="skeleton-title-large skeleton"></div>
          <div class="skeleton-category-large skeleton"></div>
          <div class="skeleton-link skeleton"></div>
        </div>
      </div>
    </div>

    <div class="deco-line"></div>

    <div class="recommendations">
      <h2>RECOMENDACOES</h2>
      <div id="recommendations-list">
        <div class="skeleton-card">
          <div class="skeleton-cover skeleton"></div>
          <div class="skeleton-content">
            <div class="skeleton-category skeleton"></div>
            <div class="skeleton-title skeleton"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-cover skeleton"></div>
          <div class="skeleton-content">
            <div class="skeleton-category skeleton"></div>
            <div class="skeleton-title skeleton"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-cover skeleton"></div>
          <div class="skeleton-content">
            <div class="skeleton-category skeleton"></div>
            <div class="skeleton-title skeleton"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="deco-line"></div>

    <footer>
      <p class="footer-text">
        LIBRARIA DOMUS CODICIS // 2026
      </p>
    </footer>
  </div>

  <script src="book.js"></script>
</body>
</html>
